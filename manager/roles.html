<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan CRM — Users</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading team...</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('manager');
let users = [];
let currentPage = 1;
const perPage = 25;
function goToTeamPage(n) { currentPage = n; render(); }
const colorList = ['teal','pink','orange','blue','purple','indigo'];

async function loadUsers() {
  try {
    const data = await apiFetch(API.getUsers, { method:'GET' });
    users = Array.isArray(data) ? data : (data.users || []);
  } catch(e) { users = []; }
  render();
}

function render() {
  // Manager only sees their affiliated salespersons
  const myTeam = users.filter(u => (u.role === 'sales' || u.role === 'Salesperson') && u.manager_id === user.id);

  const totalPages = Math.max(1, Math.ceil(myTeam.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageItems = paginateItems(myTeam, currentPage, perPage);

  document.getElementById('app').innerHTML = renderSidebar(user, 'm-roles') + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">My Team</h1>
        <p class="page-subtitle">Activate or deactivate your salespersons — contact Admin to add new users</p>
      </div>
    </div>

    <div style="background:#FEF3C7;border-radius:10px;padding:12px 16px;font-size:12px;color:#92400E;margin-bottom:24px;display:flex;align-items:center;gap:10px">
      <i class="ti ti-info-circle" style="font-size:16px" aria-hidden="true"></i>
      <span>As a Manager, you can only activate or deactivate salespersons on your team. To create new users or change roles, contact the Admin.</span>
    </div>

    <!-- Active / Inactive count -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px">
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #10B981">
        <div class="stat-label">Active Salespersons</div>
        <div style="font-size:26px;font-weight:700;color:#059669;margin-top:4px">${myTeam.filter(u=>!u.status||u.status==='Active').length}</div>
      </div>
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #EF4444">
        <div class="stat-label">Inactive Salespersons</div>
        <div style="font-size:26px;font-weight:700;color:#DC2626;margin-top:4px">${myTeam.filter(u=>u.status==='Inactive').length}</div>
      </div>
    </div>

    <div class="table-card">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #F3F4F6">
        <span style="font-size:13px;font-weight:600;color:#374151">My Salespersons (${myTeam.length})</span>
        <span style="font-size:12px;color:#9CA3AF">${myTeam.filter(u=>u.status==='Active').length} active</span>
      </div>
      <div class="table-scroll"><table>
        <thead><tr><th>Salesperson</th><th>Email</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          ${myTeam.length === 0
            ? `<tr><td colspan="4" style="text-align:center;padding:40px;color:#9CA3AF">No salespersons assigned to you yet</td></tr>`
            : pageItems.map((u) => {
              const i = myTeam.indexOf(u);
              const ini = (u.initials || (u.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase());
              const col = u.color || colorList[i % colorList.length];
              const active = !u.status || u.status === 'Active';
              return `<tr>
                <td><div class="rep-cell">
                  <div class="avatar-sm" style="${avatarColors(col)}">${esc(ini)}</div>
                  <div style="font-size:13px;font-weight:500;color:#111827">${esc(u.name)}</div>
                </div></td>
                <td style="color:#6B7280">${esc(u.email)}</td>
                <td><span class="badge ${active?'status-active':'status-inactive'}">${active?'Active':'Inactive'}</span></td>
                <td>
                  <button class="btn-sm" style="color:${active?'#DC2626':'#059669'};border-color:${active?'#FECACA':'#BBF7D0'}"
                    onclick="toggleStatus('${u.id}','${active?'Inactive':'Active'}')">
                    ${active?'Deactivate':'Activate'}
                  </button>
                </td>
              </tr>`;
            }).join('')}
        </tbody>
      </table></div>
      ${paginationControlsHTML(myTeam.length, currentPage, perPage, 'goToTeamPage')}
    </div>
  </main>`;
}

async function toggleStatus(id, newStatus) {
  try {
    await apiFetch(API.updateRole(id), { method:'PUT', body:JSON.stringify({ status:newStatus }) });
    const u = users.find(u => u.id == id);
    if (u) u.status = newStatus;
    showToast(`User ${newStatus === 'Active' ? 'activated' : 'deactivated'}`);
    render();
  } catch(e) {}
}

loadUsers();
</script>
</body>
</html>
