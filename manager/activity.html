<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan CRM — Team Activity</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .act-row { display:flex; align-items:flex-start; gap:14px; padding:14px 18px; border-bottom:1px solid #F3F4F6; }
  .act-row:last-child { border-bottom:none; }
  .act-icon { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
  .act-body { flex:1; min-width:0; }
  .act-action { font-size:13px; font-weight:600; color:#111827; }
  .act-user { color:#1B2A6B; }
  .act-details { font-size:12px; color:#6B7280; margin-top:2px; }
  .act-time { font-size:11px; color:#9CA3AF; white-space:nowrap; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading activity...</div>
  </div>
</div>
<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('manager');
let activities = [];
let teamMembers = []; // [{id, name}] — id-based to handle duplicate names safely
let filterUserId = '';
let dateFilter = createDateFilterState();
dateFilter.preset = 'last30';

function onDateFilterChange(preset) { dateFilter.preset = preset; if (preset !== 'custom') { dateFilter.from=''; dateFilter.to=''; } loadActivities(); }
function onDateFilterChangeCustom(field, val) { dateFilter[field] = val; if (dateFilter.from && dateFilter.to) loadActivities(); else render(); }

function actIcon(action) {
  if (action === 'Login') return { icon:'ti-login', bg:'#EEF0F8', color:'#1B2A6B' };
  if (action === 'Lead Added') return { icon:'ti-plus', bg:'#D1FAE5', color:'#065F46' };
  if (action === 'Lead Updated') return { icon:'ti-pencil', bg:'#FEF3C7', color:'#92400E' };
  if (action === 'Stage Changed') return { icon:'ti-arrow-right', bg:'#DBEAFE', color:'#1D4ED8' };
  if (action === 'Reminder Set') return { icon:'ti-bell', bg:'#FCE7F3', color:'#9D174D' };
  return { icon:'ti-activity', bg:'#F3F4F6', color:'#6B7280' };
}

function fmtTime(t) {
  if (!t) return '';
  return new Date(t).toLocaleString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,day:'numeric',month:'short'});
}

async function loadActivities() {
  try {
    // Get team members (salespersons affiliated with this manager) — keyed by id
    const usersData = await apiFetch(API.getUsers, { method:'GET' });
    const allUsers = Array.isArray(usersData) ? usersData : (usersData.users || []);
    const myTeam = allUsers.filter(u => (u.role === 'sales') && (u.manager_id === user.id));
    teamMembers = [{ id: user.id, name: user.name, email: user.email }, ...myTeam.map(u => ({ id: u.id, name: u.name, email: u.email }))];
    const visibleIds = teamMembers.map(m => m.id);

    const { start, end } = getDateRangeBounds(dateFilter.preset, dateFilter.from, dateFilter.to);
    const data = await apiFetch(API.getActivities(start ? start.toISOString() : '', end ? end.toISOString() : ''), { method:'GET' });
    let all = [];
    if (data && Array.isArray(data.activities)) all = data.activities;
    else if (Array.isArray(data)) all = data;

    // Manager sees own activity + their team's activity — matched by user_id, not name
    activities = all.filter(a => visibleIds.includes(a.user_id));
  } catch(e) { activities = []; }
  render();
}

function render() {
  let filtered = activities.filter(a => !filterUserId || a.user_id === filterUserId);

  document.getElementById('app').innerHTML = renderSidebar(user, 'm-activity') + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Team Activity</h1>
        <p class="page-subtitle">Your activity plus your team's — logins, leads, and reminders. Defaults to the last 30 days.</p>
      </div>
      <button class="btn-outline" onclick="loadActivities()"><i class="ti ti-refresh" aria-hidden="true"></i> Refresh</button>
    </div>

    <div style="margin-bottom:14px">${dateFilterHTML(dateFilter,'onDateFilterChange')}</div>

    <div class="table-toolbar" style="margin-bottom:16px;background:#fff;border:1px solid #E5E7EB;border-radius:12px">
      <select onchange="filterUserId=this.value;render()">
        <option value="">All team members (${teamMembers.length})</option>
        ${teamMembers.map(m => `<option value="${m.id}" ${filterUserId===m.id?'selected':''}>${esc(m.name)}${m.id===user.id?' (You)':''} — ${esc(m.email||'')}</option>`).join('')}
      </select>
    </div>

    <div class="table-card">
      ${filtered.length === 0
        ? `<div style="text-align:center;padding:48px;color:#9CA3AF;font-size:13px">No activity recorded yet</div>`
        : filtered.map(a => {
          const ic = actIcon(a.action);
          return `<div class="act-row">
            <div class="act-icon" style="background:${ic.bg};color:${ic.color}"><i class="ti ${ic.icon}" aria-hidden="true"></i></div>
            <div class="act-body">
              <div class="act-action"><span class="act-user">${esc(a.user_name)}</span> · ${esc(a.action)}</div>
              <div class="act-details">${esc(a.details || '')}${a.ip_address ? ' · IP: ' + esc(a.ip_address) : ''}</div>
            </div>
            <div class="act-time">${fmtTime(a.created_at)}</div>
          </div>`;
        }).join('')}
    </div>
  </main>`;
}

loadActivities();
</script>
</body>
</html>
