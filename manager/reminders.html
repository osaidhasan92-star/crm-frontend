<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan Technologies — Team Reminders</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .summary-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .summary-card { background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .summary-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .summary-count { font-size:24px; font-weight:700; color:#111827; line-height:1; }
  .summary-label { font-size:12px; color:#9CA3AF; margin-top:3px; }

  .reminder-list { display:flex; flex-direction:column; gap:10px; }
  .reminder-card { background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:16px; transition:box-shadow 0.15s; }
  .reminder-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.06); }
  .reminder-card.is-done    { opacity:0.5; }
  .reminder-card.is-overdue { border-left:3px solid #EF4444; }
  .reminder-card.is-today   { border-left:3px solid #F59E0B; }

  .type-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .reminder-body { flex:1; min-width:0; }
  .reminder-company { font-size:14px; font-weight:600; color:#111827; }
  .reminder-contact { font-size:12px; color:#9CA3AF; margin-top:1px; }
  .reminder-note    { font-size:13px; color:#374151; margin-top:5px; }
  .reminder-meta    { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }

  .filter-tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
  .filter-tab { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid #E5E7EB; background:#fff; color:#6B7280; transition:all 0.15s; }
  .filter-tab.active { background:#1B2A6B; color:#fff; border-color:#1B2A6B; }

  .section-group { margin-bottom:28px; }
  .section-group-title { font-size:12px; font-weight:600; color:#6B7280; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .section-group-title::after { content:''; flex:1; height:1px; background:#F3F4F6; }

  .rep-tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:#EEF0F8; color:#0F1A45; }
  .empty-msg { text-align:center; padding:40px; color:#9CA3AF; font-size:13px; }

  .toolbar-row { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .toolbar-row input, .toolbar-row select { border:1px solid #E5E7EB; border-radius:8px; padding:7px 12px; font-size:13px; color:#374151; outline:none; font-family:inherit; background:#fff; }
  .toolbar-row input { flex:1; min-width:180px; }
  .toolbar-row input:focus, .toolbar-row select:focus { border-color:#1B2A6B; }
  @media (max-width:900px) {
    .summary-strip { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px) {
    .summary-strip { grid-template-columns:1fr; }
    .reminder-card { flex-wrap:wrap; }
    .reminder-card > div[style*="display:flex;gap:8px"] { width:100%; justify-content:flex-end; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" class="toast"></div>

<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('manager');

let reminders = [];
let activeFilter = 'all';
let filterRep = '';

async function loadReminders() {
  try {
    // Backend now scopes this to the manager's own reminders + their
    // CURRENT team's reminders (live), so no client-side re-filtering needed.
    const data = await apiFetch(API.getReminders, { method:"GET" });
    if (data && Array.isArray(data.reminders)) reminders = data.reminders;
    else if (Array.isArray(data)) reminders = data;
    else reminders = [];
  } catch(e) {
    reminders = [];
  }
  render();
}

function counts() {
  const active = reminders.filter(r => !r.done);
  return {
    overdue:  active.filter(r => reminderStatus(r.date, r.done) === 'overdue').length,
    today:    active.filter(r => reminderStatus(r.date, r.done) === 'today').length,
    upcoming: active.filter(r => ['upcoming','tomorrow'].includes(reminderStatus(r.date, r.done))).length,
    done:     reminders.filter(r => r.done).length,
  };
}

function getFiltered() {
  let list = reminders;
  if (filterRep) list = list.filter(r => r.rep === filterRep);
  if (activeFilter === 'overdue')  return list.filter(r => !r.done && reminderStatus(r.date,r.done) === 'overdue');
  if (activeFilter === 'today')    return list.filter(r => !r.done && reminderStatus(r.date,r.done) === 'today');
  if (activeFilter === 'upcoming') return list.filter(r => !r.done && ['upcoming','tomorrow'].includes(reminderStatus(r.date,r.done)));
  if (activeFilter === 'done')     return list.filter(r => r.done);
  return list;
}

function grouped(list) {
  const g = { Overdue:[], Today:[], Tomorrow:[], Upcoming:[], Done:[] };
  list.forEach(r => {
    const s = reminderStatus(r.date, r.done);
    if (r.done)            g.Done.push(r);
    else if (s==='overdue')  g.Overdue.push(r);
    else if (s==='today')    g.Today.push(r);
    else if (s==='tomorrow') g.Tomorrow.push(r);
    else                     g.Upcoming.push(r);
  });
  return g;
}

function cardHTML(r) {
  const s  = reminderStatus(r.date, r.done);
  const sl = reminderStatusLabel(r.date, r.done);
  const borderCls = r.done ? 'is-done' : s==='overdue' ? 'is-overdue' : s==='today' ? 'is-today' : '';
  return `
    <div class="reminder-card ${borderCls}">
      <div class="type-icon" style="${typeColor(r.type)}">
        <i class="ti ${typeIcon(r.type)}" aria-hidden="true"></i>
      </div>
      <div class="reminder-body">
        <div class="reminder-company">${esc(r.company)}</div>
        <div class="reminder-contact">${esc(r.contact)}</div>
        <div class="reminder-note">${esc(r.note)}</div>
        <div class="reminder-meta">
          <span class="badge ${sl.cls}">${sl.label}</span>
          <span class="badge" style="background:#F3F4F6;color:#6B7280">${r.type}</span>
          <span class="rep-tag">
            <span style="width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;${avatarColors(r.repColor)}">${esc(r.repInitials)}</span>
            ${esc(r.rep)}
          </span>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button class="btn-sm ${r.done?'':'btn-sm-green'}" onclick="toggleDone(${r.id})" style="${r.done?'':'border-color:#BBF7D0;background:#F0FDF4;color:#059669'}">
          <i class="ti ${r.done?'ti-refresh':'ti-check'}" aria-hidden="true"></i>
          ${r.done ? 'Reopen' : 'Done'}
        </button>
      </div>
    </div>`;
}

function groupSection(label, items, color) {
  if (!items.length) return '';
  return `
    <div class="section-group">
      <div class="section-group-title" style="${color?'color:'+color:''}">${label}</div>
      ${items.map(cardHTML).join('')}
    </div>`;
}

function render() {
  const c    = counts();
  const list = getFiltered();
  const g    = grouped(list);
  const reps = [...new Set(reminders.map(r => r.rep).filter(Boolean))];
  const total = reminders.length;

  document.getElementById('app').innerHTML = renderSidebar(user, 'm-reminders', reminderCountsFrom(reminders)) + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Team Reminders</h1>
        <p class="page-subtitle">Follow-up tracker across all sales reps</p>
      </div>
    </div>

    <!-- Summary strip -->
    <div class="summary-strip">
      <div class="summary-card">
        <div class="summary-icon" style="background:#FEE2E2;color:#DC2626">
          <i class="ti ti-alert-circle" aria-hidden="true"></i>
        </div>
        <div>
          <div class="summary-count">${c.overdue}</div>
          <div class="summary-label">Overdue</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#FEF3C7;color:#D97706">
          <i class="ti ti-clock" aria-hidden="true"></i>
        </div>
        <div>
          <div class="summary-count">${c.today}</div>
          <div class="summary-label">Due today</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#DBEAFE;color:#2563EB">
          <i class="ti ti-calendar" aria-hidden="true"></i>
        </div>
        <div>
          <div class="summary-count">${c.upcoming}</div>
          <div class="summary-label">Upcoming</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#D1FAE5;color:#059669">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
        </div>
        <div>
          <div class="summary-count">${c.done}</div>
          <div class="summary-label">Completed</div>
        </div>
      </div>
    </div>

    <!-- Toolbar: filter by rep + search -->
    <div class="toolbar-row">
      <select onchange="filterRep=this.value;render()">
        <option value="">All reps (${reps.length})</option>
        ${reps.map(r => `<option value="${r}" ${filterRep===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <div class="filter-tab ${activeFilter==='all'?'active':''}"      onclick="setFilter('all')">All (${total})</div>
      <div class="filter-tab ${activeFilter==='overdue'?'active':''}"  onclick="setFilter('overdue')">Overdue (${c.overdue})</div>
      <div class="filter-tab ${activeFilter==='today'?'active':''}"    onclick="setFilter('today')">Today (${c.today})</div>
      <div class="filter-tab ${activeFilter==='upcoming'?'active':''}" onclick="setFilter('upcoming')">Upcoming (${c.upcoming})</div>
      <div class="filter-tab ${activeFilter==='done'?'active':''}"     onclick="setFilter('done')">Done (${c.done})</div>
    </div>

    <!-- Grouped cards -->
    <div class="reminder-list">
      ${groupSection('Overdue', g.Overdue, '#DC2626')}
      ${groupSection('Today',   g.Today,   '#D97706')}
      ${groupSection('Tomorrow',g.Tomorrow, '')}
      ${groupSection('Upcoming',g.Upcoming, '')}
      ${groupSection('Completed',g.Done,   '')}
      ${list.length === 0 ? `<div class="empty-msg">No reminders in this category.</div>` : ''}
    </div>
  </main>`;
}

function setFilter(f) { activeFilter = f; render(); }

async function toggleDone(id) {
  const r = reminders.find(r => r.id === id);
  if (r) {
    r.done = !r.done;
    try { await apiFetch(API.updateReminder(id), { method:"PUT", body:JSON.stringify({ done:r.done }) }); } catch(e) {}
    showToast(r.done ? `Marked done — ${r.company}` : `Reopened — ${r.company}`);
    render();
  }
}

loadReminders();
</script>
</body>
</html>
