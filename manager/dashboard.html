<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan Technologies — Team Overview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  .rep-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #F3F4F6; }
  .rep-row:last-child { border-bottom:none; }
  .rep-info { flex:1; min-width:0; }
  .rep-name  { font-size:13px; font-weight:500; color:#111827; }
  .rep-value { font-size:13px; font-weight:700; color:#111827; white-space:nowrap; }
  .rep-pct   { font-size:11px; color:#6B7280; width:28px; text-align:right; }
  .stage-row { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:#F9FAFB; border-radius:8px; }
  .stage-row-left  { display:flex; align-items:center; gap:8px; }
  .stage-row-right { display:flex; align-items:center; gap:10px; }
  .stage-count { font-size:13px; font-weight:600; color:#111827; min-width:20px; text-align:right; }
  .mini-bar  { width:80px; height:5px; background:#E5E7EB; border-radius:3px; overflow:hidden; }
  .mini-fill { height:100%; border-radius:3px; }
  .lb-row { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid #F3F4F6; }
  .lb-row:last-child { border-bottom:none; }
  .lb-rank { font-size:22px; width:32px; text-align:center; flex-shrink:0; }
  .lb-info { flex:1; min-width:0; }
  .lb-name  { font-size:13px; font-weight:600; color:#111827; }
  .lb-deals { font-size:11px; color:#9CA3AF; margin-top:2px; }
  .lb-bar   { height:6px; background:#E5E7EB; border-radius:3px; overflow:hidden; margin-top:5px; }
  .lb-fill  { height:100%; border-radius:3px; }
  .lb-value { font-size:13px; font-weight:700; color:#111827; white-space:nowrap; }
  .chart-wrap { position:relative; width:100%; height:220px; }
  @media (max-width:900px) {
    .two-col { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading dashboard...</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('manager');
let stats = {};
let allLeads = [];
let activities = [];
let teamReminders = [];

async function loadActivities() {
  try {
    const data = await apiFetch(API.getActivities(), { method:'GET' });
    if (data && Array.isArray(data.activities)) activities = data.activities;
    else if (Array.isArray(data)) activities = data;
    else activities = [];
  } catch(e) { activities = []; }
}

async function loadStats() {
  let teamNames = [];
  let teamIds = [];
  try {
    // Get team members affiliated with this manager
    const usersData = await apiFetch(API.getUsers, { method:'GET' });
    const allUsers = Array.isArray(usersData) ? usersData : (usersData.users || []);
    const myTeam = allUsers.filter(u => u.role === 'sales' && u.manager_id === user.id);
    teamNames = myTeam.map(u => u.name);
    teamIds = myTeam.map(u => u.id);
    const visibleIds = [user.id, ...teamIds];

    await loadActivities();
    activities = activities.filter(a => visibleIds.includes(a.user_id));

    const data = await apiFetch(API.getStats, { method:'GET' });
    // Backend now scopes this correctly by each lead's CURRENT assigned rep's
    // manager (live), so no client-side re-filtering needed here anymore.
    allLeads = data.leads || [];
    // Trust the server's computed stats directly — it already includes
    // pipelineByCurrency and per-rep valueByCurrency, which the older
    // client-side buildStats() below doesn't know how to compute.
    stats = data;
  } catch(e) {
    // fallback — only used if the API call itself fails
    allLeads = [];
    stats = buildStats(allLeads);
  }

  // Load reminders for calendar — backend already scopes to own + current team
  try {
    const remData = await apiFetch(API.getReminders, { method:'GET' });
    if (remData && Array.isArray(remData.reminders)) teamReminders = remData.reminders;
    else if (Array.isArray(remData)) teamReminders = remData;
    else teamReminders = [];
  } catch(e) {
    teamReminders = [];
  }

  render();
}

function buildStats(leads) {
  const pipeline = leads.reduce((s,l)=>s+(Number(l.value)||0),0);
  const pipelineByCurrency = sumByCurrency(activeOnly(leads));
  const closed   = leads.filter(l=>l.stage==='Closed Won');
  const repMap   = {};
  leads.forEach(l => {
    const rep = l.rep || l.rep_name || l.assigned_to_name || 'Unknown';
    if (!repMap[rep]) repMap[rep] = { name:rep, value:0, valueByCurrency:{USD:0,PKR:0}, deals:0, leads:0, initials:(rep.split(' ').map(w=>w[0]).join('').slice(0,2)), color:'teal' };
    repMap[rep].leads++;
    if (l.stage==='Closed Won') {
      repMap[rep].value += Number(l.value)||0;
      const cur = (l.currency||'USD').toUpperCase() === 'PKR' ? 'PKR' : 'USD';
      repMap[rep].valueByCurrency[cur] += Number(l.value)||0;
      repMap[rep].deals++;
    }
  });
  return {
    pipeline, pipelineByCurrency, closedCount:closed.length,
    conversionRate: leads.length ? Math.round(closed.length/leads.length*100) : 0,
    activeLeads: leads.length,
    reps: Object.values(repMap).sort((a,b)=>b.value-a.value),
    stageBreakdown: {
      'New': leads.filter(l=>l.stage==='New').length,
      'Contact Made': leads.filter(l=>l.stage==='Contact Made').length,
      'Demo': leads.filter(l=>l.stage==='Demo').length,
      'Proposal Sent': leads.filter(l=>l.stage==='Proposal Sent').length,
      'Closed Won': leads.filter(l=>l.stage==='Closed Won').length,
    }
  };
}

const medals = ['🥇','🥈','🥉','4th','5th'];
const medBarColors = ['#F59E0B','#9CA3AF','#D97706','#34D399','#4A5A9A'];
const repColors = ['teal','pink','orange','blue','purple','indigo'];
const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const chartYear = new Date().getFullYear();

const stageStats = [
  {label:'New',color:'#4A5A9A'},{label:'Contact Made',color:'#FBBF24'},
  {label:'Demo',color:'#60A5FA'},{label:'Proposal Sent',color:'#F472B6'},{label:'Closed Won',color:'#34D399'}
];

let dateFilter = createDateFilterState();
function onDateFilterChange(preset) { dateFilter.preset = preset; if (preset !== 'custom') { dateFilter.from=''; dateFilter.to=''; } render(); }
function onDateFilterChangeCustom(field, val) { dateFilter[field] = val; render(); }

function render() {
  const scopedLeads = applyDateFilter(allLeads, dateFilter);
  const s = buildStats(scopedLeads);
  const reps = s.reps || [];
  const maxVal = reps.length ? Math.max(...reps.map(r=>r.value),1) : 1;
  const breakdown = s.stageBreakdown || {};
  const maxStage  = Math.max(...Object.values(breakdown),1);

  document.getElementById('app').innerHTML = renderSidebar(user,'m-dashboard', reminderCountsFrom(teamReminders)) + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Team Overview</h1>
        <p class="page-subtitle">Welcome back, ${esc(user.name.split(' ')[0])}. Here's your team's pipeline today.</p>
        <p style="font-size:11px;color:#9CA3AF;margin-top:4px"><i class="ti ti-clock" aria-hidden="true"></i> Logged in at ${user.login_time ? new Date(user.login_time).toLocaleString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, day:'numeric', month:'short' }) : '—'}</p>
      </div>
      <button class="btn-outline" onclick="loadStats()"><i class="ti ti-refresh" aria-hidden="true"></i> Refresh</button>
    </div>

    <div style="margin-bottom:14px">${dateFilterHTML(dateFilter,'onDateFilterChange')}</div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px">
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #1B2A6B"><div class="stat-label">Pipeline — USD</div><div class="stat-value" id="kpi-pipeline-usd">$0</div></div>
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #059669"><div class="stat-label">Pipeline — PKR</div><div class="stat-value" id="kpi-pipeline-pkr">₨0</div></div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Deals Closed</div><div class="stat-value" id="kpi-deals">0</div><div class="stat-sub">Closed Won</div></div>
      <div class="stat-card"><div class="stat-label">Conversion Rate</div><div class="stat-value" id="kpi-conv">0%</div><div class="progress-bar"><div class="progress-fill" id="kpi-bar" style="width:0%"></div></div></div>
      <div class="stat-card"><div class="stat-label">Active Leads</div><div class="stat-value" id="kpi-leads">0</div><div class="stat-sub neutral">Across all reps</div></div>
    </div>

    <div class="section-card" style="margin-bottom:24px">
      <div style="margin-bottom:16px">
        <div class="section-card-title" style="margin-bottom:2px">Revenue & Pipeline — ${chartYear}</div><div style="font-size:12px;color:#9CA3AF">Monthly closed revenue vs pipeline, split by currency</div>
      </div>
      <div class="chart-wrap" style="height:260px"><canvas id="revenue-chart"></canvas></div>
    </div>

    <div class="two-col">
      <div class="section-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <div class="section-card-title" style="margin-bottom:0">Sales Leaderboard</div>
          <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#FEF3C7;color:#92400E">Live</span>
        </div>
        ${reps.length === 0
          ? `<div style="color:#9CA3AF;font-size:13px;padding:20px 0;text-align:center">No sales data yet</div>`
          : reps.slice(0,5).map((r,i) => {
          const vc = r.valueByCurrency || { USD:0, PKR:0 };
          const parts = [];
          if (vc.USD) parts.push(fmtMoney(vc.USD,'USD'));
          if (vc.PKR) parts.push(fmtMoney(vc.PKR,'PKR'));
          const valueDisplay = parts.length ? parts.join(' · ') : fmtMoney(0,'USD');
          return `
          <div class="lb-row">
            <div class="lb-rank">${medals[i]||'—'}</div>
            <div class="avatar-sm" style="${avatarColors(repColors[i]||'teal')}">${esc(r.initials||'??')}</div>
            <div class="lb-info">
              <div class="lb-name">${esc(r.name)}</div>
              <div class="lb-deals">${r.deals} deals · ${r.leads} leads</div>
              <div class="lb-bar"><div class="lb-fill" style="width:${Math.round(r.value/maxVal*100)}%;background:${medBarColors[i]||'#4A5A9A'}"></div></div>
            </div>
            <div style="text-align:right">
              <div class="lb-value">${valueDisplay}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="section-card">
        <div class="section-card-title">Pipeline by Stage</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${stageStats.map(s => {
            const cnt = breakdown[s.label]||0;
            const pct = Math.round(cnt/maxStage*100)||0;
            return `<div class="stage-row">
              <div class="stage-row-left"><div style="width:8px;height:8px;border-radius:50%;background:${s.color};flex-shrink:0"></div><span style="font-size:13px;color:#374151">${s.label}</span></div>
              <div class="stage-row-right"><div class="mini-bar"><div class="mini-fill" style="width:${pct}%;background:${s.color}"></div></div><span class="stage-count">${cnt}</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="section-card" style="margin-top:24px">
      <div class="section-card-title">Team Reminders Calendar</div>
      <div style="max-width:420px;margin:0 auto">${renderReminderCalendar(teamReminders)}</div>
    </div>

    <div class="section-card" style="margin-top:24px">
      <div class="section-card-title">Activity Log</div>
      ${activities.length === 0
        ? '<div style="color:#9CA3AF;font-size:13px;padding:16px 0">No activity recorded yet</div>'
        : activities.slice(0, 15).map(a => `
          <div style="display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #F3F4F6">
            <div style="width:30px;height:30px;border-radius:50%;background:#EEF0F8;color:#1B2A6B;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px">
              <i class="ti ${a.action==='Login'?'ti-login':a.action==='Lead Added'?'ti-plus':a.action==='Stage Changed'?'ti-arrow-right':a.action==='Reminder Set'?'ti-bell':'ti-pencil'}" aria-hidden="true"></i>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;color:#111827"><strong style="font-weight:600">${esc(a.user_name||'Unknown')}</strong> · ${esc(a.action)}</div>
              <div style="font-size:12px;color:#6B7280;margin-top:1px">${esc(a.details||'')}</div>
            </div>
            <div style="font-size:11px;color:#9CA3AF;white-space:nowrap">${a.created_at ? new Date(a.created_at).toLocaleString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,day:'numeric',month:'short'}) : ''}</div>
          </div>`).join('')}
    </div>
  </main>`;

  // Animate KPIs
  animCount('kpi-pipeline-usd', (s.pipelineByCurrency && s.pipelineByCurrency.USD) || 0, '', '', true, '$');
  animCount('kpi-pipeline-pkr', (s.pipelineByCurrency && s.pipelineByCurrency.PKR) || 0, '', '', true, '₨');
  animCount('kpi-deals', s.closedCount||0);
  animCount('kpi-leads', s.activeLeads||0);
  const cr = s.conversionRate||0;
  const convEl=document.getElementById('kpi-conv'), barEl=document.getElementById('kpi-bar');
  const t0=performance.now();
  (function step(now){const p=Math.min((now-t0)/1000,1);const e=1-Math.pow(1-p,3);const v=Math.round(cr*e);convEl.textContent=v+'%';barEl.style.width=v+'%';if(p<1)requestAnimationFrame(step);})(t0);

  // Chart — built from this manager's real leads, not hardcoded demo data.
  // Dual Y-axis: USD (left) and PKR (right) each get their own scale, since
  // PKR amounts are numerically much larger than equivalent USD amounts —
  // sharing one axis would make one currency invisible next to the other.
  const chartData = buildMonthlyChartData(scopedLeads);
  if (window._revenueChart) window._revenueChart.destroy(); // avoid stacking duplicate charts on each Refresh
  window._revenueChart = new Chart(document.getElementById('revenue-chart'),{
    data:{labels:months,datasets:[
      {type:'bar',label:'Closed (USD $K)',data:chartData.revenueUSD,backgroundColor:'#1B2A6B',borderRadius:5,borderSkipped:false,order:3,yAxisID:'yUSD'},
      {type:'bar',label:'Closed (PKR ₨K)',data:chartData.revenuePKR,backgroundColor:'#059669',borderRadius:5,borderSkipped:false,order:4,yAxisID:'yPKR'},
      {type:'line',label:'Pipeline (USD $K)',data:chartData.pipelineUSD,borderColor:'#4A5A9A',borderDash:[5,4],borderWidth:2,pointBackgroundColor:'#1B2A6B',pointRadius:3,tension:0.4,fill:false,order:1,yAxisID:'yUSD'},
      {type:'line',label:'Pipeline (PKR ₨K)',data:chartData.pipelinePKR,borderColor:'#6EE7B7',borderDash:[5,4],borderWidth:2,pointBackgroundColor:'#059669',pointRadius:3,tension:0.4,fill:false,order:2,yAxisID:'yPKR'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:11},color:'#6B7280'}},tooltip:{backgroundColor:'#1F2937',callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y}`}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#9CA3AF',font:{size:11}}},
        yUSD:{position:'left',grid:{color:'#F3F4F6'},ticks:{color:'#9CA3AF',font:{size:11},callback:v=>'$'+v+'K'},beginAtZero:true,title:{display:true,text:'USD',color:'#9CA3AF',font:{size:10}}},
        yPKR:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#9CA3AF',font:{size:11},callback:v=>'₨'+v+'K'},beginAtZero:true,title:{display:true,text:'PKR',color:'#9CA3AF',font:{size:10}}}
      }
    }
  });
}

function animCount(id, target, prefix='', suffix='', isMoney=false, symbol='$') {
  const el=document.getElementById(id); if(!el) return;
  const t0=performance.now();
  (function step(now){const p=Math.min((now-t0)/1000,1);const e=1-Math.pow(1-p,3);const v=Math.round(target*e);
  el.textContent=isMoney?symbol+(v>=1000?(v/1000).toFixed(1)+'K':v.toLocaleString()):prefix+v.toLocaleString()+suffix;
  if(p<1)requestAnimationFrame(step);})(t0);
}

loadStats();
</script>
</body>
</html>
