<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan Technologies — CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { font-family:'Inter',sans-serif; box-sizing:border-box; }
  body { margin:0; background:#F0F2F8; min-height:100vh; }
  .brand-navy  { color:#1B2A6B; }
  .bg-navy     { background:#1B2A6B; }
  .bg-navy-dark{ background:#152158; }
  .border-navy { border-color:#1B2A6B; }
  input:focus  { outline:2px solid #1B2A6B; outline-offset:1px; border-color:transparent !important; }
  .toast { position:fixed; bottom:24px; right:24px; background:#1F2937; color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; z-index:200; opacity:0; transform:translateY(8px); transition:all 0.25s; pointer-events:none; max-width:320px; }
  .toast.show { opacity:1; transform:translateY(0); }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; margin-right:6px; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Left panel gradient using Roshan navy */
  .left-panel { background: linear-gradient(135deg, #0F1A45 0%, #1B2A6B 50%, #2D3F8F 100%); }
</style>
</head>
<body>
<div class="min-h-screen flex">

  <!-- Left branding panel — logo with subtle decorative accents -->
  <div class="hidden lg:flex w-5/12 flex-col items-center justify-center p-14 relative overflow-hidden" style="background:linear-gradient(160deg, #FAFBFF 0%, #F0F2F8 100%); border-right:1px solid #E5E7EB;">

    <!-- Top accent line -->
    <div style="position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, #1B2A6B 0%, #2D3F8F 50%, #8A9BB0 100%);"></div>

    <!-- Decorative corner lines — top left -->
    <svg style="position:absolute; top:40px; left:40px; opacity:0.5;" width="60" height="60" viewBox="0 0 60 60" fill="none">
      <path d="M0 20 L20 20 L20 0" stroke="#1B2A6B" stroke-width="2"/>
      <circle cx="20" cy="20" r="3" fill="#1B2A6B"/>
    </svg>

    <!-- Decorative corner lines — bottom right -->
    <svg style="position:absolute; bottom:40px; right:40px; opacity:0.5;" width="60" height="60" viewBox="0 0 60 60" fill="none">
      <path d="M60 40 L40 40 L40 60" stroke="#1B2A6B" stroke-width="2"/>
      <circle cx="40" cy="40" r="3" fill="#1B2A6B"/>
    </svg>

    <!-- Faint background circuit-style dotted line accents -->
    <svg style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.06;" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice">
      <line x1="0" y1="150" x2="180" y2="150" stroke="#1B2A6B" stroke-width="2" stroke-dasharray="6 6"/>
      <line x1="320" y1="650" x2="500" y2="650" stroke="#1B2A6B" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="180" cy="150" r="5" fill="#1B2A6B"/>
      <circle cx="320" cy="650" r="5" fill="#1B2A6B"/>
    </svg>

    <!-- Logo card with soft shadow lift -->
    <div style="position:relative; z-index:2; background:#ffffff; border-radius:24px; padding:48px 56px; box-shadow:0 20px 60px -12px rgba(27,42,107,0.15), 0 0 0 1px rgba(27,42,107,0.04);">
      <img src="assets/logo.png" alt="Roshan Technologies" style="max-width:320px;width:100%;height:auto;display:block;"/>
    </div>

    <!-- Bottom tagline strip -->
    <div style="position:relative; z-index:2; margin-top:36px; display:flex; align-items:center; gap:10px;">
      <div style="width:24px; height:2px; background:#1B2A6B; opacity:0.4;"></div>
      <span style="font-size:11px; font-weight:600; letter-spacing:1.5px; color:#6B7A99; text-transform:uppercase;">Sales CRM Platform</span>
      <div style="width:24px; height:2px; background:#1B2A6B; opacity:0.4;"></div>
    </div>

    <!-- Bottom accent line -->
    <div style="position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg, #8A9BB0 0%, #2D3F8F 50%, #1B2A6B 100%);"></div>
  </div>

  <!-- Right login panel -->
  <div class="flex-1 flex items-center justify-center p-8 bg-gray-50">
    <div class="w-full max-w-sm">

      <!-- Mobile logo -->
      <div class="flex flex-col items-center mb-8 lg:hidden">
        <img src="assets/logo.png" alt="Roshan Technologies" style="max-width:220px;width:70%;height:auto"/>
      </div>

      <h2 class="text-2xl font-bold text-gray-900 mb-1">Welcome back</h2>
      <p class="text-gray-400 text-sm mb-8">Sign in to your workspace</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Email address</label>
          <input id="email" type="email" placeholder="you@company.com"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 bg-white"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Password</label>
          <div class="relative">
            <input id="password" type="password" placeholder="••••••••"
              class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-11 text-sm text-gray-900 bg-white"
              onkeydown="if(event.key==='Enter') handleLogin()"/>
            <button type="button" onclick="togglePassword()" tabindex="-1"
              class="absolute right-0 top-0 h-full w-11 flex items-center justify-center text-gray-400 hover:text-gray-600">
              <i id="password-eye" class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button id="login-btn" onclick="handleLogin()"
          class="w-full text-white font-semibold py-3 rounded-xl text-sm transition-colors"
          style="background:#1B2A6B">
          Sign in
        </button>
      </div>

      <p class="text-center text-xs text-gray-400 mt-12">© Roshan Technologies — One Provider One Solution</p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="shared/data.js"></script>
<script src="shared/config.js"></script>
<script>
  const existing = getSession();
  if (existing) {
    if (existing.role === 'admin') window.location.href = 'admin/dashboard.html';
    else if (existing.role === 'manager') window.location.href = 'manager/dashboard.html';
    else if (existing.role === 'quote_manager') window.location.href = 'quotemanager/companies.html';
    else window.location.href = 'sales/dashboard.html';
  }

  function togglePassword() {
    const input = document.getElementById('password');
    const eye = document.getElementById('password-eye');
    if (input.type === 'password') {
      input.type = 'text';
      eye.classList.remove('ti-eye');
      eye.classList.add('ti-eye-off');
    } else {
      input.type = 'password';
      eye.classList.remove('ti-eye-off');
      eye.classList.add('ti-eye');
    }
  }

  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    if (!email || !pass) { showToast('Please enter email and password'); return; }

    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<span class="spinner"></span>Signing in...';
    btn.disabled = true;

    try {
      const data = await apiFetch(API.login, {
        method: 'POST',
        body: JSON.stringify({ email, password: pass })
      });
      if (data.error) { showToast(data.error); return; }

      // Capture IP once at login and cache it in session for reuse everywhere
      const loginIp = await getPublicIP();

      saveSession({
        id:       data.id,
        name:     data.name,
        role:     data.role,
        email:    data.email,
        token:    data.token,
        initials: data.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2),
        color:    data.role === 'manager' ? 'indigo' : data.role === 'admin' ? 'purple' : data.role === 'quote_manager' ? 'orange' : 'teal',
        manager_id: data.manager_id || null,
        login_time: new Date().toISOString(),
        ip_address: loginIp || ''
      });

      logActivity('Login', data.name + ' signed in as ' + data.role + (loginIp ? ` — IP: ${loginIp}` : ''), loginIp);

      if (data.role === 'admin')   window.location.href = 'admin/dashboard.html';
      else if (data.role === 'manager') window.location.href = 'manager/dashboard.html';
      else if (data.role === 'quote_manager') window.location.href = 'quotemanager/companies.html';
      else window.location.href = 'sales/dashboard.html';

    } catch(e) {
      btn.innerHTML = 'Sign in'; btn.disabled = false;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
    const btn = document.getElementById('login-btn');
    btn.innerHTML = 'Sign in'; btn.disabled = false;
  }
</script>
</body>
</html>
