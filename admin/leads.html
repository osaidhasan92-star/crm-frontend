<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan Technologies — All Leads</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .prob-tooltip { position:relative; cursor:default; }
  .prob-tooltip .tip-box { display:none; position:absolute; bottom:calc(100%+6px); left:50%; transform:translateX(-50%); background:#1F2937; color:#fff; font-size:11px; white-space:nowrap; padding:6px 10px; border-radius:7px; z-index:20; line-height:1.5; }
  .prob-tooltip:hover .tip-box { display:block; }
  .prob-ring { position:relative; width:34px; height:34px; flex-shrink:0; }
  .prob-ring svg { transform:rotate(-90deg); }
  .prob-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; }
  .status-active-lead   { background:#D1FAE5; color:#065F46; }
  .status-inactive-lead { background:#FEE2E2; color:#991B1B; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading leads...</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('admin');
let leads = [];
let allUsers = [];
let filterQ='', filterRep='', filterManager='', filterStage='', filterStatus='';
let openFilterDropdown = null;

function toggleManagerDropdown() { openFilterDropdown = openFilterDropdown==='manager'?null:'manager'; render(); }
function toggleRepDropdown() { openFilterDropdown = openFilterDropdown==='rep'?null:'rep'; render(); }
function toggleStageDropdown() { openFilterDropdown = openFilterDropdown==='stage'?null:'stage'; render(); }
function toggleStatusDropdown() { openFilterDropdown = openFilterDropdown==='status'?null:'status'; render(); }
function selectManagerFilter(val) { filterManager = val; filterRep=''; openFilterDropdown=null; currentPage=1; render(); }
function selectRepFilter(val) { filterRep = val; openFilterDropdown=null; currentPage=1; render(); }
function selectStageFilter(val) { filterStage = val; openFilterDropdown=null; currentPage=1; render(); }
function selectStatusFilter(val) { filterStatus = val; openFilterDropdown=null; currentPage=1; render(); }

document.addEventListener('click', (e) => {
  if (openFilterDropdown && !e.target.closest('.filter-dropdown-wrap')) {
    openFilterDropdown = null;
    render();
  }
});
let currentPage = 1;
const perPage = 25;

const STAGE_SCORE    = {'New':10,'Contact Made':25,'Demo':50,'Proposal Sent':72,'Closed Won':100,'Closed Lost':0};
const PRIORITY_BOOST = {'High':12,'Medium':5,'Low':0};
function winProb(l) {
  if(l.stage==='Closed Won') return 100;
  if(l.stage==='Closed Lost') return 0;
  return Math.min((STAGE_SCORE[l.stage]||10)+(PRIORITY_BOOST[l.priority]||0),99);
}
function probColor(p){ return p>=70?{s:'#059669',t:'#059669'}:p>=40?{s:'#F59E0B',t:'#D97706'}:{s:'#EF4444',t:'#DC2626'}; }
function probRing(l){
  const p=winProb(l),c=probColor(p),circ=81.68;
  return `<div class="prob-tooltip"><div style="display:inline-flex;align-items:center"><div class="prob-ring">
    <svg width="34" height="34" viewBox="0 0 34 34">
      <circle fill="none" stroke="#E5E7EB" stroke-width="3.5" cx="17" cy="17" r="13"/>
      <circle fill="none" stroke="${c.s}" stroke-width="3.5" stroke-linecap="round" cx="17" cy="17" r="13" stroke-dasharray="${circ}" stroke-dashoffset="${circ-(p/100)*circ}"/>
    </svg>
    <div class="prob-num" style="color:${c.t}">${p}%</div>
  </div></div><div class="tip-box">Stage: ${l.stage}<br>Priority: ${l.priority||'Medium'}</div></div>`;
}

async function loadLeads() {
  try {
    const usersData = await apiFetch(API.getUsers, { method:'GET' });
    allUsers = Array.isArray(usersData) ? usersData : (usersData.users || []);

    const data = await apiFetch(API.getLeads, { method:'GET' });
    if (data && Array.isArray(data.leads)) leads = data.leads;
    else if (Array.isArray(data)) leads = data;
    else leads = [];

    // Attach manager name to each lead via rep's manager_id
    leads = leads.map(l => {
      const repUser = allUsers.find(u => u.id === l.assigned_to || u.name === l.rep);
      const managerUser = repUser ? allUsers.find(u => u.id === repUser.manager_id) : null;
      return { ...l, manager_name: managerUser ? managerUser.name : '—' };
    });
  } catch(e) { leads = []; }
  render();
}

let dateFilter = createDateFilterState();
function onDateFilterChange(preset) { dateFilter.preset = preset; if (preset !== 'custom') { dateFilter.from=''; dateFilter.to=''; } currentPage=1; render(); }
function onDateFilterChangeCustom(field, val) { dateFilter[field] = val; currentPage=1; render(); }

function onLeadSearch(inputEl) {
  filterQ = inputEl.value;
  currentPage = 1;
  const cursorPos = inputEl.selectionStart;
  render();
  const newInput = document.getElementById('lead-search-input');
  if (newInput) {
    newInput.focus();
    newInput.setSelectionRange(cursorPos, cursorPos);
  }
}

function render() {
  const scoped = applyDateFilter(leads, dateFilter);
  const managers = [...new Set(scoped.map(l=>l.manager_name||'—'))].filter(n => n && n !== '—');
  // Rep dropdown only shows reps belonging to the currently selected manager (cascading filter)
  const repsSourceLeads = filterManager ? scoped.filter(l => (l.manager_name||'—') === filterManager) : scoped;
  const reps = [...new Set(repsSourceLeads.map(l=>l.rep||'Unknown'))].filter(Boolean);

  let filtered = scoped.filter(l => {
    const rep = l.rep || 'Unknown';
    const mgr = l.manager_name || '—';
    const q = filterQ.toLowerCase();
    const mQ = !q || (l.company||'').toLowerCase().includes(q) || rep.toLowerCase().includes(q) || (l.product||'').toLowerCase().includes(q);
    const mR = !filterRep || rep === filterRep;
    const mM = !filterManager || mgr === filterManager;
    const mS = !filterStage || l.stage === filterStage;
    const mSt = !filterStatus || (l.lead_status || '') === filterStatus || (!l.lead_status && filterStatus === 'Active');
    return mQ && mR && mM && mS && mSt;
  });

  const totalValue = filtered.reduce((s,l)=>s+(Number(l.value)||0),0);
  const currencyTotals = sumByCurrency(filtered);
  const avgProb    = filtered.length ? Math.round(filtered.reduce((s,l)=>s+winProb(l),0)/filtered.length) : 0;

  const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageItems = paginateItems(filtered, currentPage, perPage);

  document.getElementById('app').innerHTML = renderSidebar(user,'a-leads') + `
  <main class="main">
    <div class="page-header">
      <div><h1 class="page-title">All Leads</h1><p class="page-subtitle">${filtered.length} leads · ${avgProb}% avg win probability — system-wide</p></div>
      <div style="display:flex;gap:10px">
        <button title="Download pipeline report as Excel" onclick="downloadStageCountsExcel()" style="display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid #C8E6D5;border-radius:8px;background:#F0FAF4;color:#107C41;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit"><i class="ti ti-file-type-xls" aria-hidden="true" style="font-size:17px;color:#107C41"></i> Export Report</button>
        <button class="btn-outline" onclick="loadLeads()"><i class="ti ti-refresh" aria-hidden="true"></i> Refresh</button>
      </div>
    </div>

    <div style="margin-bottom:12px">${dateFilterHTML(dateFilter,'onDateFilterChange')}</div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      ${customSelectHTML('dd-manager', 'All managers', managers, filterManager, openFilterDropdown==='manager', 'toggleManagerDropdown', 'selectManagerFilter')}
      ${customSelectHTML('dd-rep', 'All reps', reps, filterRep, openFilterDropdown==='rep', 'toggleRepDropdown', 'selectRepFilter')}
      ${customSelectHTML('dd-stage', 'All stages', ['New','Contact Made','Demo','Proposal Sent','Closed Won','Closed Lost'], filterStage, openFilterDropdown==='stage', 'toggleStageDropdown', 'selectStageFilter')}
      ${customSelectHTML('dd-status', 'All status', ['Active','Inactive'], filterStatus, openFilterDropdown==='status', 'toggleStatusDropdown', 'selectStatusFilter')}
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px">
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #1B2A6B">
        <div class="stat-label">Pipeline — USD</div>
        <div style="font-size:22px;font-weight:700;color:#111827;margin-top:2px">${fmtMoney(currencyTotals.USD,'USD')}</div>
      </div>
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #059669">
        <div class="stat-label">Pipeline — PKR</div>
        <div style="font-size:22px;font-weight:700;color:#111827;margin-top:2px">${fmtMoney(currencyTotals.PKR,'PKR')}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px">
      ${['New','Contact Made','Demo','Proposal Sent','Closed Won','Closed Lost'].map(s=>{
        const cnt=filtered.filter(l=>l.stage===s).length;
        return `<div class="stat-card" style="padding:12px 14px"><div class="stat-label" style="font-size:10px">${s}</div><div style="font-size:20px;font-weight:700;color:#111827">${cnt}</div></div>`;
      }).join('')}
    </div>

    <div class="table-card">
      <div style="padding:14px 16px;border-bottom:1px solid #F3F4F6;position:relative">
        <i class="ti ti-search" aria-hidden="true" style="position:absolute;left:28px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:15px"></i>
        <input type="text" placeholder="Search by company, rep, or product..." value="${filterQ}" id="lead-search-input" oninput="onLeadSearch(this)"
          style="width:100%;max-width:420px;padding:9px 12px 9px 36px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;color:#374151;outline:none;font-family:inherit;background:#fff"/>
      </div>

      <div class="table-scroll">
      <table>
        <thead><tr><th>Company</th><th>Contact</th><th>Phone</th><th>Rep</th><th>Manager</th><th>Product</th><th>Stage</th><th>Value</th><th>Priority</th><th>Status</th><th>Win Prob.</th><th>Actions</th></tr></thead>
        <tbody>
          ${pageItems.length===0
            ? `<tr><td colspan="12" style="text-align:center;padding:40px;color:#9CA3AF">No leads match filters</td></tr>`
            : pageItems.map(l=>{
              const rep=l.rep||'Unknown';
              const ini=rep.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
              const status = l.lead_status || 'Active';
              return `<tr style="cursor:pointer" onclick="openLeadHistory('${l.id}', '${esc((l.company||'').replace(/'/g,"\\'"))}')" title="View history">
                <td class="td-company">${esc(l.company)}</td>
                <td style="color:#6B7280">${esc(l.contact || '—')}</td>
                <td style="color:#6B7280">${esc(l.phone || '—')}</td>
                <td><div class="rep-cell"><div class="avatar-xs" style="background:#EEF0F8;color:#1B2A6B">${esc(ini)}</div><span>${esc(rep)}</span></div></td>
                <td style="font-size:12px;color:#6B7280">${esc(l.manager_name||'—')}</td>
                <td>${esc(l.product||'')}</td>
                <td><span class="badge ${stageClass(l.stage)}">${l.stage}</span></td>
                <td style="font-weight:600;color:${l.stage==='Closed Won'?'#059669':'#111827'}">${fmtMoney(l.value||0, l.currency)}</td>
                <td><span class="badge ${priorityClass(l.priority||'Medium')}">${l.priority||'Medium'}</span></td>
                <td><span class="badge ${status==='Active'?'status-active-lead':'status-inactive-lead'}">${status}</span></td>
                <td>${probRing(l)}</td>
                <td><button class="btn-sm" title="View full details" onclick="event.stopPropagation(); viewLeadDetails('${l.id}')"><i class="ti ti-eye" aria-hidden="true"></i></button></td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
      </div>
      ${paginationControlsHTML(filtered.length, currentPage, perPage, 'goToLeadPage')}
      ${filtered.length>0?`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid #F3F4F6;background:#F9FAFB;flex-wrap:wrap;gap:8px"><span style="font-size:12px;color:#9CA3AF">Showing ${filtered.length} of ${scoped.length} leads</span><span style="font-size:12px;font-weight:600;color:#111827">Total: ${fmtMoney(currencyTotals.USD,'USD')} · ${fmtMoney(currencyTotals.PKR,'PKR')}</span></div>`:''}
    </div>
  </main>`;
}

function goToLeadPage(n) { currentPage = n; render(); }

function buildFilterSummary() {
  const parts = [];
  parts.push('Date: ' + (dateFilter.preset === 'custom' ? `${dateFilter.from || '…'} to ${dateFilter.to || '…'}` : dateFilter.preset));
  if (filterManager) parts.push('Manager: ' + filterManager);
  if (filterRep) parts.push('Rep: ' + filterRep);
  if (filterStage) parts.push('Stage: ' + filterStage);
  if (filterStatus) parts.push('Status: ' + filterStatus);
  if (filterQ) parts.push('Search: "' + filterQ + '"');
  return parts.length ? parts.join('  |  ') : 'All Time — no filters applied';
}

function downloadStageCountsExcel() {
  // Recomputes the exact same filtered set shown on screen right now —
  // date range, search, manager, rep, stage, and status filters all apply,
  // so the export always matches whatever the cards currently display.
  const scoped = applyDateFilter(leads, dateFilter);
  const q = filterQ.toLowerCase();
  const filteredNow = scoped.filter(l => {
    const rep = l.rep || 'Unknown';
    const mgr = l.manager_name || '—';
    const mQ = !q || (l.company||'').toLowerCase().includes(q) || rep.toLowerCase().includes(q) || (l.product||'').toLowerCase().includes(q);
    const mR = !filterRep || rep === filterRep;
    const mM = !filterManager || mgr === filterManager;
    const mS = !filterStage || l.stage === filterStage;
    const mSt = !filterStatus || (l.lead_status || '') === filterStatus || (!l.lead_status && filterStatus === 'Active');
    return mQ && mR && mM && mS && mSt;
  });

  const stages = ['New','Contact Made','Demo','Proposal Sent','Closed Won','Closed Lost'];
  const repNames = [...new Set(filteredNow.map(l => l.rep || 'Unknown'))].sort();

  // Pivot: one row per salesperson, one column per stage, plus a Total
  // column — the standard format for a pipeline breakdown report.
  const pivotHeader = ['Salesperson', ...stages, 'Total'];
  const pivotRows = repNames.map(rep => {
    const repLeads = filteredNow.filter(l => (l.rep || 'Unknown') === rep);
    const counts = stages.map(s => repLeads.filter(l => l.stage === s).length);
    return [rep, ...counts, repLeads.length];
  });
  const totalsRow = ['TOTAL', ...stages.map(s => filteredNow.filter(l => l.stage === s).length), filteredNow.length];

  const detailHeader = ['Company','Contact','Phone','Rep','Manager','Product','Stage','Value','Currency','Priority','Status'];
  const detailRows = filteredNow.map(l => [
    l.company||'', l.contact||'', l.phone||'', l.rep||'', l.manager_name||'', l.product||'', l.stage||'',
    Number(l.value)||0, l.currency||'USD', l.priority||'', l.lead_status||'Active'
  ]);

  buildStyledPipelineReport({
    title: 'Lead Stage Report',
    filterSummary: buildFilterSummary(),
    pivotHeader, pivotRows, totalsRow,
    detailHeader, detailRows, detailValueColIndex: 7,
    filenamePrefix: 'lead-stage-report'
  });
}

function viewLeadDetails(id) {
  const lead = leads.find(l => String(l.id) === String(id));
  if (lead) openLeadDetails(lead);
}

loadLeads();
</script>
</body>
</html>
