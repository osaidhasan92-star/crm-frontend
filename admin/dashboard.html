<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan CRM — Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .chart-wrap { position:relative; width:100%; height:220px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading dashboard...</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('admin');
const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const chartYear = new Date().getFullYear();
let allLeads = [];
let dateFilter = createDateFilterState();

function onDateFilterChange(preset) { dateFilter.preset = preset; if (preset !== 'custom') { dateFilter.from=''; dateFilter.to=''; } render(); }
function onDateFilterChangeCustom(field, val) { dateFilter[field] = val; render(); }

async function loadDashboard() {
  try {
    // Admin's /api/stats is unscoped — returns every lead company-wide.
    const data = await apiFetch(API.getStats, { method:'GET' });
    allLeads = data.leads || [];
  } catch(e) {
    allLeads = [];
  }
  render();
}

function render() {
  const scoped = applyDateFilter(allLeads, dateFilter);
  const currencyTotals = sumByCurrency(activeOnly(scoped));

  document.getElementById('app').innerHTML = renderSidebar(user,'a-dashboard') + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Admin Dashboard</h1>
        <p class="page-subtitle">Welcome back, ${esc(user.name.split(' ')[0])}. Here's the system overview today.</p>
        <p style="font-size:11px;color:#9CA3AF;margin-top:4px"><i class="ti ti-clock" aria-hidden="true"></i> Logged in at ${user.login_time ? new Date(user.login_time).toLocaleString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, day:'numeric', month:'short' }) : '—'}</p>
      </div>
      <a href="users.html" class="btn-primary"><i class="ti ti-user-plus" aria-hidden="true"></i> Manage Users</a>
    </div>

    <div style="margin-bottom:14px">${dateFilterHTML(dateFilter,'onDateFilterChange')}</div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px">
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #1B2A6B">
        <div class="stat-label">Pipeline — USD (company-wide)</div>
        <div style="font-size:22px;font-weight:700;color:#111827;margin-top:2px">${fmtMoney(currencyTotals.USD,'USD')}</div>
      </div>
      <div class="stat-card" style="padding:16px 20px;border-left:4px solid #059669">
        <div class="stat-label">Pipeline — PKR (company-wide)</div>
        <div style="font-size:22px;font-weight:700;color:#111827;margin-top:2px">${fmtMoney(currencyTotals.PKR,'PKR')}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px">
      <div class="stat-card" style="padding:20px 24px;border-left:4px solid #1B2A6B">
        <div class="stat-label">Your Role</div>
        <div style="font-size:22px;font-weight:700;color:#1B2A6B;margin-top:4px">Admin</div>
        <div style="font-size:12px;color:#9CA3AF;margin-top:4px">Full system access</div>
      </div>
      <div class="stat-card" style="padding:20px 24px;border-left:4px solid #059669">
        <div class="stat-label">Capabilities</div>
        <div style="font-size:13px;color:#374151;margin-top:8px;line-height:1.8">
          ✓ Create users (any role)<br>
          ✓ Assign managers to salespeople<br>
          ✓ Change roles & status
        </div>
      </div>
      <div class="stat-card" style="padding:20px 24px;border-left:4px solid #F59E0B">
        <div class="stat-label">Manager Capabilities</div>
        <div style="font-size:13px;color:#374151;margin-top:8px;line-height:1.8">
          ✓ View their team's leads<br>
          ✓ Activate / deactivate users<br>
          ✗ Cannot create users
        </div>
      </div>
    </div>

    <div class="section-card" style="margin-bottom:24px">
      <div style="margin-bottom:16px">
        <div class="section-card-title" style="margin-bottom:2px">Revenue & Pipeline — ${chartYear}</div><div style="font-size:12px;color:#9CA3AF">Company-wide, all teams combined — split by currency</div>
      </div>
      <div class="chart-wrap" style="height:260px"><canvas id="revenue-chart"></canvas></div>
    </div>

    <div class="section-card">
      <div class="section-card-title">Quick Actions</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a href="users.html" class="btn-primary"><i class="ti ti-users" aria-hidden="true"></i> Manage All Users</a>
      </div>
    </div>
  </main>`;

  // Dual Y-axis: USD (left) and PKR (right) each get their own scale, since
  // PKR amounts are numerically much larger than equivalent USD amounts —
  // sharing one axis would make one currency invisible next to the other.
  const chartData = buildMonthlyChartData(scoped);
  if (window._revenueChart) window._revenueChart.destroy();
  window._revenueChart = new Chart(document.getElementById('revenue-chart'),{
    data:{labels:months,datasets:[
      {type:'bar',label:'Closed (USD $K)',data:chartData.revenueUSD,backgroundColor:'#1B2A6B',borderRadius:5,borderSkipped:false,order:3,yAxisID:'yUSD'},
      {type:'bar',label:'Closed (PKR ₨K)',data:chartData.revenuePKR,backgroundColor:'#059669',borderRadius:5,borderSkipped:false,order:4,yAxisID:'yPKR'},
      {type:'line',label:'Pipeline (USD $K)',data:chartData.pipelineUSD,borderColor:'#4A5A9A',borderDash:[5,4],borderWidth:2,pointBackgroundColor:'#1B2A6B',pointRadius:3,tension:0.4,fill:false,order:1,yAxisID:'yUSD'},
      {type:'line',label:'Pipeline (PKR ₨K)',data:chartData.pipelinePKR,borderColor:'#6EE7B7',borderDash:[5,4],borderWidth:2,pointBackgroundColor:'#059669',pointRadius:3,tension:0.4,fill:false,order:2,yAxisID:'yPKR'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:11},color:'#6B7280'}},tooltip:{backgroundColor:'#1F2937',callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y}`}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#9CA3AF',font:{size:11}}},
        yUSD:{position:'left',grid:{color:'#F3F4F6'},ticks:{color:'#9CA3AF',font:{size:11},callback:v=>'$'+v+'K'},beginAtZero:true,title:{display:true,text:'USD',color:'#9CA3AF',font:{size:10}}},
        yPKR:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#9CA3AF',font:{size:11},callback:v=>'₨'+v+'K'},beginAtZero:true,title:{display:true,text:'PKR',color:'#9CA3AF',font:{size:10}}}
      }
    }
  });
}

loadDashboard();
</script>
</body>
</html>
