<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan CRM — Settings</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .key-box { font-family:monospace; font-size:13px; background:#F9FAFB; border:1px solid #E5E7EB; border-radius:8px; padding:12px 14px; word-break:break-all; color:#111827; position:relative; }
  .key-box.masked { letter-spacing:2px; color:#9CA3AF; }
  .key-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:300; }
  .confirm-overlay.open { display:flex; }
  .confirm-box { background:#fff; border-radius:14px; padding:24px; max-width:420px; width:90%; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading settings...</div>
  </div>
</div>

<!-- Confirm regenerate modal -->
<div id="confirm-modal" class="confirm-overlay">
  <div class="confirm-box">
    <h3 style="font-size:16px;font-weight:700;color:#111827;margin:0 0 10px">Regenerate API key?</h3>
    <p style="font-size:13px;color:#6B7280;line-height:1.6;margin:0 0 18px">
      Anything currently using this key (scripts, automations, integrations) will <strong>stop working immediately</strong> until you update it with the new key. This cannot be undone.
    </p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn-outline" onclick="closeConfirm()">Cancel</button>
      <button class="btn-primary" style="background:#DC2626" onclick="confirmRegenerate()">Yes, Regenerate</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('admin');
let apiKey = '';
let keyVisible = false;

async function loadSettings() {
  try {
    const data = await apiFetch(API.getSettings, { method:'GET' });
    apiKey = data.api_key || '';
  } catch(e) { apiKey = ''; }
  render();
}

function render() {
  const maskedKey = apiKey ? '•'.repeat(Math.min(apiKey.length, 48)) : 'No key set';
  const displayKey = keyVisible ? apiKey : maskedKey;

  document.getElementById('app').innerHTML = renderSidebar(user, 'a-settings') + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Settings</h1>
        <p class="page-subtitle">System configuration — Admin only</p>
      </div>
    </div>

    <div class="section-card" style="max-width:640px">
      <div class="section-card-title">API Key</div>
      <p style="font-size:12px;color:#6B7280;line-height:1.7;margin-bottom:16px">
        Use this key from any external tool, script, or automation platform to access any endpoint in this CRM with full admin access.
        Add it as a header named <code style="background:#F3F4F6;padding:2px 6px;border-radius:4px">X-API-Key</code>.
      </p>

      <div class="key-box ${keyVisible ? '' : 'masked'}" id="key-display">${displayKey}</div>

      <div class="key-actions">
        <button class="btn-outline" onclick="toggleVisibility()">
          <i class="ti ${keyVisible?'ti-eye-off':'ti-eye'}" aria-hidden="true"></i> ${keyVisible ? 'Hide' : 'Show'} Key
        </button>
        <button class="btn-outline" onclick="copyKey()">
          <i class="ti ti-copy" aria-hidden="true"></i> Copy Key
        </button>
        <button class="btn-primary" style="background:#DC2626" onclick="openConfirm()">
          <i class="ti ti-refresh" aria-hidden="true"></i> Regenerate Key
        </button>
      </div>

      <div style="background:#FEF3C7;border-radius:8px;padding:12px 14px;margin-top:18px;font-size:12px;color:#92400E;display:flex;gap:8px;align-items:flex-start">
        <i class="ti ti-alert-triangle" style="font-size:15px;margin-top:1px" aria-hidden="true"></i>
        <span>Keep this key private. Anyone with it has full read/write access to your entire CRM data, same as an Admin account. Never share it publicly or commit it to a public code repository.</span>
      </div>
    </div>

    <div class="section-card" style="max-width:640px;margin-top:20px">
      <div class="section-card-title">Example usage</div>
      <pre style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:14px;font-size:11px;color:#374151;overflow-x:auto;line-height:1.8">Method:  GET
URL:     https://api.roshantech.cloud/api/leads
Headers:
  X-API-Key: ${keyVisible ? apiKey : '&lt;your-key-above&gt;'}</pre>
    </div>
  </main>`;
}

function toggleVisibility() {
  keyVisible = !keyVisible;
  render();
}

function copyKey() {
  if (!apiKey) { showToast('No key to copy'); return; }
  navigator.clipboard.writeText(apiKey).then(() => {
    showToast('API key copied to clipboard');
  }).catch(() => {
    showToast('Could not copy — please copy manually');
  });
}

function openConfirm() { document.getElementById('confirm-modal').classList.add('open'); }
function closeConfirm() { document.getElementById('confirm-modal').classList.remove('open'); }

async function confirmRegenerate() {
  closeConfirm();
  try {
    const data = await apiFetch(API.regenerateKey, { method:'POST' });
    apiKey = data.api_key;
    keyVisible = true;
    showToast('New API key generated — update anything using the old key');
    render();
  } catch(e) {}
}

document.addEventListener('click', e => { if (e.target.id === 'confirm-modal') closeConfirm(); });
loadSettings();
</script>
</body>
</html>
