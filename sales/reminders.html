<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roshan Technologies — My Reminders</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<style id="shared-style"></style>
<style>
  .summary-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .summary-card { background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .summary-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .summary-count { font-size:24px; font-weight:700; color:#111827; line-height:1; }
  .summary-label { font-size:12px; color:#9CA3AF; margin-top:3px; }

  .reminder-list { display:flex; flex-direction:column; gap:10px; }
  .reminder-card { background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:16px; transition:box-shadow 0.15s; }
  .reminder-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.06); }
  .reminder-card.is-done    { opacity:0.5; }
  .reminder-card.is-overdue { border-left:3px solid #EF4444; }
  .reminder-card.is-today   { border-left:3px solid #F59E0B; }

  .type-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .reminder-body { flex:1; min-width:0; }
  .reminder-company { font-size:14px; font-weight:600; color:#111827; }
  .reminder-contact { font-size:12px; color:#9CA3AF; margin-top:1px; }
  .reminder-note { font-size:13px; color:#374151; margin-top:5px; }
  .reminder-meta { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .reminder-actions { display:flex; gap:8px; flex-shrink:0; }

  .check-btn { width:32px; height:32px; border-radius:50%; border:2px solid #E5E7EB; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; color:#9CA3AF; font-size:15px; }
  .check-btn:hover { border-color:#1B2A6B; color:#1B2A6B; }
  .check-btn.checked { background:#1B2A6B; border-color:#1B2A6B; color:#fff; }

  .filter-tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
  .filter-tab { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid #E5E7EB; background:#fff; color:#6B7280; transition:all 0.15s; }
  .filter-tab.active { background:#1B2A6B; color:#fff; border-color:#1B2A6B; }

  .section-group { margin-bottom:28px; }
  .section-group-title { font-size:12px; font-weight:600; color:#6B7280; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .section-group-title::after { content:''; flex:1; height:1px; background:#F3F4F6; }
  .empty-msg { text-align:center; padding:32px; color:#9CA3AF; font-size:13px; }
  @media (max-width:900px) {
    .summary-strip { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px) {
    .summary-strip { grid-template-columns:1fr; }
    .reminder-card { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;gap:14px;background:#F8F9FC;font-family:Arial,sans-serif">
    <style>@keyframes crm-spin { to { transform:rotate(360deg); } }</style>
    <div style="width:36px;height:36px;border:3px solid #E5E7EB;border-top-color:#1B2A6B;border-radius:50%;animation:crm-spin 0.8s linear infinite"></div>
    <div style="font-size:13px;color:#9CA3AF">Loading reminders...</div>
  </div>
</div>

<!-- Add Reminder Modal -->
<div id="modal-reminder" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Add Reminder</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div>
          <div class="field-label">Company / Lead</div>
          <select id="r-lead" class="field-input" onchange="fillContact(this.value)">
            <option value="">Select a lead</option>
            <!-- options injected by JS after leads load -->
            <option value="0">Other (type below)</option>
          </select>
        </div>
        <div>
          <div class="field-label">Contact Person</div>
          <input id="r-contact" class="field-input" placeholder="Auto-filled or type name"/>
        </div>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">Reminder Type</div>
          <select id="r-type" class="field-input">
            <option value="Call">Call</option>
            <option value="Email">Email</option>
            <option value="Meeting">Meeting</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <div class="field-label">Date</div>
          <input id="r-date" class="field-input" type="date"/>
        </div>
      </div>
      <div>
        <div class="field-label">Note / Task</div>
        <textarea id="r-note" class="field-input" rows="3" placeholder="What do you need to do?" style="resize:none"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
      <button id="save-reminder-btn" class="btn-primary" onclick="saveReminder()">
        <i class="ti ti-bell" aria-hidden="true"></i> Set Reminder
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
document.getElementById('shared-style').textContent = SHARED_CSS;
const user = requireAuth('sales');
let reminders = [];
let myLeads = [];
let activeFilter = 'all';

// ── Load leads (for the dropdown) + reminders (for the list) ──
async function loadAll() {
  await Promise.all([loadMyLeads(), loadReminders()]);
  populateLeadDropdown();
  render();
}

async function loadMyLeads() {
  try {
    const data = await apiFetch(API.getLeads, { method:'GET' });
    if (data && Array.isArray(data.leads)) myLeads = data.leads;
    else if (Array.isArray(data)) myLeads = data;
    else myLeads = [];
  } catch(e) {
    myLeads = [];
  }
}

async function loadReminders() {
  try {
    const data = await apiFetch(API.getReminders, { method:'GET' });
    // Backend now scopes this to the logged-in salesperson's own reminders only.
    if (data && Array.isArray(data.reminders)) reminders = data.reminders;
    else if (Array.isArray(data)) reminders = data;
    else reminders = [];
  } catch(e) {
    reminders = [];
  }
}

// ── Fill the dropdown with real leads (JS-driven, not template string in HTML) ──
function populateLeadDropdown() {
  const sel = document.getElementById('r-lead');
  // Clear existing options except first + last
  sel.innerHTML = '<option value="">Select a lead</option>';
  myLeads.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = l.company;
    sel.appendChild(opt);
  });
  const other = document.createElement('option');
  other.value = '0';
  other.textContent = 'Other (type below)';
  sel.appendChild(other);
}

function fillContact(leadId) {
  const lead = myLeads.find(l => String(l.id) === String(leadId));
  document.getElementById('r-contact').value = lead ? (lead.contact || '') : '';
}

// Default date = today
function setDefaultDate() {
  document.getElementById('r-date').value = new Date().toISOString().split('T')[0];
}

function counts() {
  return {
    overdue:  reminders.filter(r => !r.done && reminderStatus(r.date, r.done) === 'overdue').length,
    today:    reminders.filter(r => !r.done && reminderStatus(r.date, r.done) === 'today').length,
    upcoming: reminders.filter(r => !r.done && ['upcoming','tomorrow'].includes(reminderStatus(r.date, r.done))).length,
    done:     reminders.filter(r => r.done).length,
  };
}

function filtered() {
  if (activeFilter === 'overdue')  return reminders.filter(r => !r.done && reminderStatus(r.date,r.done) === 'overdue');
  if (activeFilter === 'today')    return reminders.filter(r => !r.done && reminderStatus(r.date,r.done) === 'today');
  if (activeFilter === 'upcoming') return reminders.filter(r => !r.done && ['upcoming','tomorrow'].includes(reminderStatus(r.date,r.done)));
  if (activeFilter === 'done')     return reminders.filter(r => r.done);
  return reminders;
}

function groupedReminders(list) {
  const groups = { Overdue:[], Today:[], Tomorrow:[], Upcoming:[], Done:[] };
  list.forEach(r => {
    const s = reminderStatus(r.date, r.done);
    if (r.done)            groups.Done.push(r);
    else if (s==='overdue')  groups.Overdue.push(r);
    else if (s==='today')    groups.Today.push(r);
    else if (s==='tomorrow') groups.Tomorrow.push(r);
    else                     groups.Upcoming.push(r);
  });
  return groups;
}

function reminderCardHTML(r) {
  const s = reminderStatus(r.date, r.done);
  const sl = reminderStatusLabel(r.date, r.done);
  const borderClass = r.done ? 'is-done' : s === 'overdue' ? 'is-overdue' : s === 'today' ? 'is-today' : '';
  return `
    <div class="reminder-card ${borderClass}">
      <div class="type-icon" style="${typeColor(r.type)}">
        <i class="ti ${typeIcon(r.type)}" aria-hidden="true"></i>
      </div>
      <div class="reminder-body">
        <div class="reminder-company">${esc(r.company) || 'Other'}</div>
        <div class="reminder-contact">${esc(r.contact) || ''}</div>
        <div class="reminder-note">${esc(r.note)}</div>
        <div class="reminder-meta">
          <span class="badge ${sl.cls}">${sl.label}</span>
          <span class="badge" style="background:#F3F4F6;color:#6B7280">${r.type}</span>
        </div>
      </div>
      <div class="reminder-actions">
        <button class="check-btn ${r.done?'checked':''}" onclick="toggleDone('${r.id}')" title="${r.done?'Mark as pending':'Mark as done'}">
          <i class="ti ti-check" aria-hidden="true"></i>
        </button>
        <button class="btn-danger-sm" onclick="deleteReminder('${r.id}')">
          <i class="ti ti-trash" aria-hidden="true"></i>
        </button>
      </div>
    </div>`;
}

function render() {
  const c = counts();
  const list = filtered();
  const groups = groupedReminders(list);

  document.getElementById('app').innerHTML = renderSidebar(user, 's-reminders', reminderCountsFrom(reminders)) + `
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">My Reminders</h1>
        <p class="page-subtitle">Stay on top of every follow-up</p>
      </div>
      <button class="btn-primary" onclick="openModal()">
        <i class="ti ti-plus" aria-hidden="true"></i> Add Reminder
      </button>
    </div>

    <div class="summary-strip">
      <div class="summary-card">
        <div class="summary-icon" style="background:#FEE2E2;color:#DC2626"><i class="ti ti-alert-circle" aria-hidden="true"></i></div>
        <div class="summary-info"><div class="summary-count">${c.overdue}</div><div class="summary-label">Overdue</div></div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#FEF3C7;color:#D97706"><i class="ti ti-clock" aria-hidden="true"></i></div>
        <div class="summary-info"><div class="summary-count">${c.today}</div><div class="summary-label">Due today</div></div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#DBEAFE;color:#2563EB"><i class="ti ti-calendar" aria-hidden="true"></i></div>
        <div class="summary-info"><div class="summary-count">${c.upcoming}</div><div class="summary-label">Upcoming</div></div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#D1FAE5;color:#059669"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
        <div class="summary-info"><div class="summary-count">${c.done}</div><div class="summary-label">Completed</div></div>
      </div>
    </div>

    <div class="filter-tabs">
      <div class="filter-tab ${activeFilter==='all'?'active':''}"      onclick="setFilter('all')">All (${reminders.length})</div>
      <div class="filter-tab ${activeFilter==='overdue'?'active':''}"  onclick="setFilter('overdue')">Overdue (${c.overdue})</div>
      <div class="filter-tab ${activeFilter==='today'?'active':''}"    onclick="setFilter('today')">Today (${c.today})</div>
      <div class="filter-tab ${activeFilter==='upcoming'?'active':''}" onclick="setFilter('upcoming')">Upcoming (${c.upcoming})</div>
      <div class="filter-tab ${activeFilter==='done'?'active':''}"     onclick="setFilter('done')">Done (${c.done})</div>
    </div>

    <div class="reminder-list">
      ${groups.Overdue.length ? `<div class="section-group"><div class="section-group-title" style="color:#DC2626">Overdue</div>${groups.Overdue.map(reminderCardHTML).join('')}</div>` : ''}
      ${groups.Today.length ? `<div class="section-group"><div class="section-group-title" style="color:#D97706">Today</div>${groups.Today.map(reminderCardHTML).join('')}</div>` : ''}
      ${groups.Tomorrow.length ? `<div class="section-group"><div class="section-group-title">Tomorrow</div>${groups.Tomorrow.map(reminderCardHTML).join('')}</div>` : ''}
      ${groups.Upcoming.length ? `<div class="section-group"><div class="section-group-title">Upcoming</div>${groups.Upcoming.map(reminderCardHTML).join('')}</div>` : ''}
      ${groups.Done.length ? `<div class="section-group"><div class="section-group-title">Completed</div>${groups.Done.map(reminderCardHTML).join('')}</div>` : ''}
      ${list.length === 0 ? `<div class="empty-msg">No reminders in this category. You're all caught up!</div>` : ''}
    </div>
  </main>`;
}

function setFilter(f) { activeFilter = f; render(); }

async function toggleDone(id) {
  const r = reminders.find(r => String(r.id) === String(id));
  if (!r) return;
  const newDone = !r.done;
  try {
    await apiFetch(API.updateReminder(id), { method:'PUT', body:JSON.stringify({ done:newDone }) });
    r.done = newDone;
    showToast(newDone ? 'Marked as done' : 'Marked as pending');
    render();
  } catch(e) {}
}

async function deleteReminder(id) {
  try {
    await apiFetch(API.deleteReminder(id), { method:'DELETE' });
    reminders = reminders.filter(r => String(r.id) !== String(id));
    showToast('Reminder removed');
    render();
  } catch(e) {
    // apiFetch already shows an error toast on failure
  }
}

function openModal() {
  populateLeadDropdown();
  setDefaultDate();
  document.getElementById('modal-reminder').classList.add('open');
}
function closeModal() { document.getElementById('modal-reminder').classList.remove('open'); }

async function saveReminder() {
  const leadId = document.getElementById('r-lead').value;
  const lead = myLeads.find(l => String(l.id) === String(leadId));
  const company = lead ? lead.company : (leadId === '0' ? 'Other' : '');
  if (!leadId) { showToast('Please select a lead'); return; }

  const date = document.getElementById('r-date').value;
  if (!date) { showToast('Please pick a date'); return; }

  const type = document.getElementById('r-type').value;
  const note = document.getElementById('r-note').value.trim();
  if (!note) { showToast('Please add a note'); return; }

  const btn = document.getElementById('save-reminder-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;

  try {
    await apiFetch(API.saveReminder, { method:'POST', body:JSON.stringify({
      leadId: leadId === '0' ? null : leadId,
      company,
      contact: document.getElementById('r-contact').value || '',
      type:    document.getElementById('r-type').value,
      note,
      date
    })});
    closeModal();
    document.getElementById('r-note').value = '';
    document.getElementById('r-lead').value = '';
    document.getElementById('r-contact').value = '';
    activeFilter = 'all';
    showToast('Reminder set!'); logActivity('Reminder Set', type + ' reminder for ' + company);
    await loadReminders();
    render();
  } catch(e) {
  } finally {
    btn.innerHTML = '<i class="ti ti-bell" aria-hidden="true"></i> Set Reminder';
    btn.disabled = false;
  }
}

document.addEventListener('click', e => { if (e.target.id === 'modal-reminder') closeModal(); });
loadAll();
</script>
</body>
</html>
